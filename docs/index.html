  <h2 align="center">Rust-native 版本</h2>
  <p>
    桌面界面已迁移到 Rust + egui。机型配置、中文 fallback 字体和文曲星图形符号字体随程序构建，不再依赖 Qt、qmake、外部 QHelp 文件或样式 XML。
  <ul>
    <li>GVBASIC 示例位于 <i>examples/bas</i>。</li>
    <li>模拟器文件位于运行目录下的 <i>dat_files</i>。</li>
    <li>运行方式：<code>cargo run -p wqxtools-gui</code>。</li>
  </ul>
  <hr />
  </p>
  <p>如有问题或者建议，请前往 <a href="https://github.com/arucil/wqxtools">https://github.com/arucil/wqxtools</a> 发起 issue。</p>
